<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<!--
  data-theme будет переопределён inline-скриптом ниже
  для предотвращения flash. Если Telegram не загрузился — остаётся dark.
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>MEOW!</title>
<link rel="icon" type="image/png" href="assets/Group%2027.png">
<link rel="shortcut icon" type="image/png" href="assets/Group%2027.png">
<link rel="apple-touch-icon" href="assets/Group%2027.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════
   DESIGN TOKENS
══════════════════════════════════════════════════ */
:root {
  /* Telegram-driven цвета (прописываются через style.setProperty в рантайме).
     Если Telegram недоступен — используются дизайнерские fallback. */
  --c-canvas:   var(--tg-bg-color, #e7e5f1);
  --c-glass:    rgba(249, 247, 255, 0.70);
  --c-glass-br: rgba(255, 255, 255, 0.58);
  --c-card:     var(--tg-secondary-bg-color, rgba(255, 255, 255, 0.93));
  --c-card-br:  var(--tg-accent-text-color, #191432);
  --c-pill:     rgba(18, 14, 44, 0.88);
  --c-pill-fg:  #ede8ff;
  --c-soft-br:  rgba(24, 20, 50, 0.09);
  --c-t1:       var(--tg-text-color, #15112e);
  --c-t2:       var(--tg-hint-color, #726d88);
  --c-accent:   var(--tg-button-color, #6652bb);
  --c-accent-d: rgba(102, 82, 187, 0.10);
  --c-accent-g: rgba(102, 82, 187, 0.22);
  --c-pin:      #ccc3ec;
  --c-pin-a:    var(--tg-button-color, #6652bb);
  --c-pin-e:    var(--tg-text-color, #15112e);
  --c-sol-bg:   var(--tg-button-color, #15112e);
  --c-sol-fg:   var(--tg-button-text-color, #ffffff);
  --c-out-br:   var(--tg-accent-text-color, #15112e);
  --c-out-fg:   var(--tg-accent-text-color, #15112e);

  --sh-card:  0 8px 32px rgba(102,82,187,.13), 0 2px 6px rgba(0,0,0,.06);
  --sh-float: 0 2px 12px rgba(0,0,0,.09), 0 1px 3px rgba(0,0,0,.04);
  --sh-glow:  0 4px 22px rgba(102,82,187,.26);

  --blur: blur(20px) saturate(1.6);
  --r-p: 999px; --r-c: 20px; --r-b: 50px;
  --ph: 14px; --bar-h: 62px;
  --sai-t: env(safe-area-inset-top,0px);
  --sai-b: env(safe-area-inset-bottom,0px);
  --ease-s: cubic-bezier(.34,1.56,.64,1);
  --ease-o: cubic-bezier(.16,1,.3,1);
  --ff: 'Manrope', system-ui, sans-serif;
}

[data-theme="dark"] {
  /* Telegram-driven тёмная тема (fallback — дизайнерские цвета) */
  --c-canvas:   var(--tg-bg-color, #0b0b1a);
  --c-glass:    rgba(17,14,42,.78);
  --c-glass-br: rgba(118,98,218,.17);
  --c-card:     var(--tg-secondary-bg-color, rgba(15,12,40,.92));
  --c-card-br:  var(--tg-accent-text-color, rgba(118,98,218,.28));
  --c-pill:     rgba(22,18,54,.92);
  --c-pill-fg:  #dbd4ff;
  --c-soft-br:  rgba(118,98,218,.11);
  --c-t1:       var(--tg-text-color, #ece6ff);
  --c-t2:       var(--tg-hint-color, #938eb4);
  --c-accent:   var(--tg-button-color, #9880de);
  --c-accent-d: rgba(152,128,222,.14);
  --c-accent-g: rgba(152,128,222,.26);
  --c-pin:      #6652bb;
  --c-pin-a:    var(--tg-button-color, #b3a6ee);
  --c-pin-e:    var(--tg-text-color, #ece6ff);
  --c-sol-bg:   var(--tg-button-color, #6e5ec8);
  --c-sol-fg:   var(--tg-button-text-color, #ffffff);
  --c-out-br:   var(--tg-accent-text-color, rgba(152,128,222,.48));
  --c-out-fg:   var(--tg-button-color, #dbd4ff);

  --sh-card:  0 8px 40px rgba(0,0,0,.54), 0 2px 8px rgba(0,0,0,.24);
  --sh-float: 0 2px 16px rgba(0,0,0,.30);
  --sh-glow:  0 4px 24px rgba(152,128,222,.28);
}

/* ══════════════════════════════════════════════════
   BASE
══════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Убираем жёлтую/синюю обводку при тапе в Telegram WebView (Android) */
button,a,[role="button"],[tabindex]{-webkit-tap-highlight-color:transparent;outline:none}
html,body{height:100%;overflow:hidden}
body{font-family:var(--ff);background:var(--c-canvas);color:var(--c-t1);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{cursor:pointer;font-family:inherit;border:none;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font-family:inherit;border:none;outline:none;background:none;-webkit-tap-highlight-color:transparent}
svg{display:block;flex-shrink:0}

/* ── Shell ──────────────────────────────────────── */
#app{position:relative;width:100%;height:100dvh;max-width:428px;margin:0 auto;overflow:hidden}

/* ── Map ────────────────────────────────────────── */
#map{position:absolute;inset:0;z-index:0}
.maplibregl-ctrl-logo,.maplibregl-ctrl-attrib,
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none!important}

/* ── Loading ────────────────────────────────────── */
#loading{
  position:absolute;inset:0;z-index:50;
  background:var(--c-canvas);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .4s ease,visibility .4s ease;
}
#loading.gone{opacity:0;visibility:hidden;pointer-events:none}
#loading img{width:48px;height:48px;object-fit:contain;animation:spin-load .8s linear infinite}
@keyframes spin-load{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;font-weight:600;color:var(--c-t2)}

/* ══════════════════════════════════════════════════
   TOP BAR — logo | theme-btn | avatar
══════════════════════════════════════════════════ */
.top-bar{
  position:absolute;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--sai-t) + 10px) var(--ph) 8px;
  background:linear-gradient(180deg,var(--c-canvas) 52%,transparent);
  pointer-events:none;
}
.top-bar>*{pointer-events:auto}

.logo{display:flex;align-items:center;height:38px}
.logo img{height:38px;width:auto;display:block}

.tb-right{display:flex;align-items:center;gap:8px}

.icon-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--c-glass);border:1px solid var(--c-glass-br);
  color:var(--c-t1);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-float);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  transition:transform .14s var(--ease-s),box-shadow .14s;
}
.icon-btn:active{transform:scale(.88)}

.avatar-btn{
  width:38px;height:38px;border-radius:50%;overflow:hidden;
  background:var(--c-accent);border:2px solid rgba(255,255,255,.28);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;letter-spacing:-.2px;
  box-shadow:var(--sh-glow),var(--sh-float);
  background-size:cover;background-position:center;
   transition:transform .14s var(--ease-s);
  flex-shrink:0;-webkit-tap-highlight-color:transparent;
}
.avatar-btn:active{transform:scale(.88)}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}

.pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:var(--r-p);
  font-size:13px;font-weight:700;letter-spacing:.01em;
  white-space:nowrap;cursor:pointer;
  box-shadow:var(--sh-float);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  transition:transform .14s var(--ease-s),box-shadow .14s;
}
.pill:active{transform:scale(.95)}
.pill-glass{
  background:var(--c-glass);color:var(--c-t1);border:1px solid var(--c-glass-br);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
}
.pill-glass:hover{box-shadow:var(--sh-glow)}

/* ══════════════════════════════════════════════════
   FILTER ROW — date-pill | events
══════════════════════════════════════════════════ */
.filter-row{
  position:absolute;z-index:20;
  top:calc(var(--sai-t) + 62px);
  left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--ph);
  pointer-events:none;
}
.filter-row>*{pointer-events:auto}

/* ══════════════════════════════════════════════════
   POSTER CAROUSEL (компактная карусель)
══════════════════════════════════════════════════ */
.poster-carousel{
  position:absolute;z-index:18;left:0;right:0;
  top:calc(var(--sai-t) + 112px);
  height:156px;pointer-events:auto;
  padding:8px var(--ph);box-sizing:border-box;
  overflow:hidden;background:transparent;
  transition:transform .3s var(--ease-o),opacity .3s var(--ease-o);
}
.poster-track{
  display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;
  height:100%;scrollbar-width:none;-ms-overflow-style:none;
  padding:0;margin:0;
}
.poster-track::-webkit-scrollbar{display:none}
.poster-card{
  flex:0 0 132px;height:100%;border-radius:14px;overflow:hidden;
  position:relative;cursor:pointer;box-shadow:var(--sh-float);
  background:var(--c-glass);border:1px solid var(--c-glass-br);
  display:flex;flex-direction:column;transition:transform .15s var(--ease-s),box-shadow .15s;
}
.poster-card:active{transform:scale(.96)}
.poster-card:hover{box-shadow:var(--sh-glow)}
.poster-card img{
  width:100%;height:100%;object-fit:cover;object-position:center;
  display:block;flex:1;
}
/* Заглушка (placeholder) — уменьшенное лого */
.poster-card img[src$="Group 27.png"]{
  width:67%;height:67%;
  object-fit:contain;
  margin:auto;
}
.poster-overlay{
  position:absolute;left:0;right:0;bottom:0;
  padding:8px;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,.42),transparent);
  color:#fff;display:flex;flex-direction:column;justify-content:flex-end;
  min-height:56px;
}
.poster-title{
  font-weight:800;font-size:11px;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;
}
.poster-date{
  font-size:10px;opacity:.85;margin-top:3px;font-weight:600;
}

.carousel-toggle{
  position:absolute;
  top:calc(var(--sai-t) + 112px + 6px);
  right:var(--ph);
  z-index:20;
  width:22px;height:22px;
}
.carousel-toggle:active{transform:scale(.88)}
.carousel-toggle .toggle-icon-hidden{position:absolute;opacity:0;transition:opacity .3s}
.carousel-toggle[aria-expanded="false"] .toggle-icon-hidden{opacity:1}
.carousel-toggle[aria-expanded="false"] .toggle-icon-visible{opacity:0}

/* Карусель скрыта — выезжает вправо */
.poster-carousel{
  transition:transform .6s var(--ease-o),opacity .6s var(--ease-o);
}
.poster-carousel.hidden{
  height:156px;opacity:0;pointer-events:none;
  transform:translateX(120%);
}
.poster-carousel.hidden .poster-track{opacity:0;transition:opacity .3s}

/* ══════════════════════════════════════════════════
   EVENTS PANEL
══════════════════════════════════════════════════ */
.events-panel{
  position:absolute;z-index:25;
  top:calc(var(--sai-t) + 112px);
  right:var(--ph);
  width:min(244px,calc(100% - 28px));
  max-height:calc(100dvh - 230px);
  background:var(--c-glass);border:1px solid var(--c-glass-br);
  border-radius:var(--r-c);
  box-shadow:var(--sh-card);
  overflow:hidden;display:flex;flex-direction:column;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  opacity:0;transform:translateY(-10px) scale(.97);
  transform-origin:top right;pointer-events:none;
  transition:opacity .22s var(--ease-o),transform .22s var(--ease-o);
}
.events-panel.open{opacity:1;transform:none;pointer-events:auto}
.panel-head{
  display:flex;align-items:center;gap:6px;padding:11px 14px 9px;
  border-bottom:1px solid var(--c-soft-br);flex-shrink:0;
  overflow-x:auto;scrollbar-width:none;
  -ms-overflow-style:none;
}
.panel-head::-webkit-scrollbar{display:none}
.panel-head .pill{font-size:11.5px;padding:6px 14px;flex-shrink:0}
.events-list{overflow-y:auto;padding:6px;flex:1;scrollbar-width:thin;scrollbar-color:var(--c-accent-d) transparent}
.events-list::-webkit-scrollbar{width:3px}
.events-list::-webkit-scrollbar-thumb{background:var(--c-accent-d);border-radius:2px}
.day-label{padding:5px 8px 3px;font-size:9.5px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;color:var(--c-t2)}
.event-item{padding:9px 10px 9px 12px;border-radius:12px;border-left:3px solid transparent;cursor:pointer;transition:background .12s,border-color .12s}
.event-item:hover{background:var(--c-accent-d)}
.event-item.active{background:var(--c-accent-d);border-left-color:var(--c-accent)}
.event-item-title{font-size:12.5px;font-weight:700;line-height:1.3}
.event-item-sub{font-size:11px;color:var(--c-t2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ══════════════════════════════════════════════════
   EVENT CARD
══════════════════════════════════════════════════ */
.event-card{
  position:absolute;z-index:20;
  left:var(--ph);right:var(--ph);
  bottom:calc(var(--sai-b) + var(--bar-h) + 12px);
  background:var(--c-card);border:2.5px solid var(--c-card-br);
  border-radius:var(--r-c);
  padding:15px 16px 17px;
  box-shadow:var(--sh-card);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  opacity:0;transform:translateY(22px);pointer-events:none;
  transition:opacity .28s var(--ease-o),transform .28s var(--ease-o);
}
.event-card.open{opacity:1;transform:translateY(0);pointer-events:auto}

.venue-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-p);background:var(--c-accent-d);font-size:11px;font-weight:700;color:var(--c-accent);margin-bottom:10px;max-width:calc(100% - 36px)}
.venue-tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.venue-tag.is-link{cursor:pointer;transition:background .12s,box-shadow .12s}
.venue-tag.is-link:hover{background:var(--c-accent-g);box-shadow:var(--sh-glow)}

.card-close{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--c-soft-br);background:var(--c-accent-d);color:var(--c-t2);display:flex;align-items:center;justify-content:center;transition:all .13s}
.card-close:hover{border-color:var(--c-accent);color:var(--c-accent)}

.card-title{font-size:20px;font-weight:900;line-height:1.18;color:var(--c-t1);margin-bottom:10px;padding-right:30px;letter-spacing:-.3px}
.card-meta{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.meta-row{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--c-t2);line-height:1}
.meta-row svg{color:var(--c-accent)}
  .card-desc{font-size:12.5px;line-height:1.62;color:var(--c-t2);margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-tags, .detail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .tag-pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:var(--c-accent-d);color:var(--c-accent);font-size:11px;font-weight:600;line-height:1}
  .card-actions{display:flex;gap:8px}
.btn-a,.btn-b{flex:1;height:43px;border-radius:var(--r-b);font-size:13px;font-weight:700;transition:transform .13s var(--ease-s),box-shadow .13s}
.btn-a{background:var(--c-sol-bg);color:var(--c-sol-fg)}
.btn-b{background:transparent;color:var(--c-out-fg);border:2px solid var(--c-out-br)}
.btn-a:hover{box-shadow:var(--sh-glow)}
.btn-a:active,.btn-b:active{transform:scale(.97)}

/* ══════════════════════════════════════════════════
   DETAIL MODAL
══════════════════════════════════════════════════ */
.event-detail{
  position:absolute;z-index:40;inset:0;
  display:flex;flex-direction:column;
  background:var(--c-canvas);
  opacity:0;transform:translateY(100%);pointer-events:none;
  transition:opacity .36s var(--ease-o),transform .36s var(--ease-o);
}
.event-detail.open{opacity:1;transform:translateY(0);pointer-events:auto}

  .detail-poster{position:relative;width:100%;height:238px;flex-shrink:0;overflow:hidden;cursor:zoom-in;transition:height 0.3s var(--ease-o)}
  .detail-poster.expanded{height:auto;cursor:zoom-out}
  .detail-poster img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .detail-poster.expanded img{object-fit:contain;background:var(--c-canvas);transition:all .3s var(--ease-o)}
.poster-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.poster-initial{font-size:96px;font-weight:900;color:rgba(255,255,255,.18);line-height:1;user-select:none}
.poster-fade{position:absolute;bottom:0;left:0;right:0;height:88px;background:linear-gradient(transparent,var(--c-canvas))}

.detail-back{
  position:absolute;top:calc(var(--sai-t) + 12px);left:14px;z-index:2;
  width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.18);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
  transition:transform .14s var(--ease-s),background .14s;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.detail-back:active{transform:scale(.88)}

.detail-body{
  flex:1;overflow-y:auto;
  padding:18px var(--ph) calc(var(--sai-b) + 96px);
  scrollbar-width:thin;scrollbar-color:var(--c-accent-d) transparent;
}
.detail-body::-webkit-scrollbar{width:3px}
.detail-body::-webkit-scrollbar-thumb{background:var(--c-accent-d);border-radius:2px}

.detail-venue-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-p);background:var(--c-accent-d);font-size:11px;font-weight:700;color:var(--c-accent);margin-bottom:12px}
.detail-title{font-size:24px;font-weight:900;line-height:1.14;letter-spacing:-.4px;color:var(--c-t1);margin-bottom:14px}
.detail-meta{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.detail-meta .meta-row{font-size:13.5px}
.detail-desc{font-size:14px;line-height:1.72;color:var(--c-t2)}

.detail-actions{
  position:absolute;bottom:0;left:0;right:0;
  padding:16px var(--ph) calc(var(--sai-b) + 16px);
  background:linear-gradient(0deg,var(--c-canvas) 62%,transparent);
  display:flex;gap:8px;
}
.btn-contacts{
  flex:1;height:44px;border-radius:var(--r-b);
  background:var(--c-glass);border:1px solid var(--c-glass-br);
  color:var(--c-t1);font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px;
  backdrop-filter:var(--blur);
  transition:transform .13s var(--ease-s),box-shadow .13s;
}
.btn-contacts:active{transform:scale(.97)}
.btn-detail-share{
  flex:1;height:44px;border-radius:var(--r-b);
  background:var(--c-sol-bg);color:var(--c-sol-fg);
  font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .13s var(--ease-s),box-shadow .13s;
}
.btn-detail-share:hover{box-shadow:var(--sh-glow)}
.btn-detail-share:active{transform:scale(.97)}

/* ══════════════════════════════════════════════════
   BOTTOM BAR — search
══════════════════════════════════════════════════ */
.bottom-bar{
  position:absolute;z-index:20;left:0;right:0;bottom:0;
  padding:8px var(--ph) calc(var(--sai-b) + 8px);
  background:linear-gradient(0deg,var(--c-canvas) 52%,transparent);
  pointer-events:none;
}
.bottom-bar>*{pointer-events:auto}

<script>
  // ══════════════════════════════════════════════════
  // Синхронная предзагрузка темы — NO FLASH
  // ══════════════════════════════════════════════════
  (function() {
    try {
      var tg = window.Telegram?.WebApp;
      var tp = tg?.themeParams;
      // 1. Определяем тему из Telegram themeParams
      var theme;
      if (tp?.bg_color) {
        var c = tp.bg_color.replace('#','');
        var r = parseInt(c.substring(0,2),16);
        var g = parseInt(c.substring(2,4),16);
        var b = parseInt(c.substring(4,6),16);
        theme = (r*299 + g*587 + b*114)/1000 < 128 ? 'dark' : 'light';
      }
      // 2. Если пользователь уже выбирал тему (из localStorage) — приоритет
      try {
        var saved = localStorage.getItem('meow-theme');
        if (saved === 'dark' || saved === 'light') theme = saved;
      } catch(e) {}
      // 3. Fallback
      if (!theme) theme = 'dark';
      // 4. Устанавливаем data-theme ДО отрисовки
      document.documentElement.setAttribute('data-theme', theme);
      // 5. Прописываем CSS-переменные Telegram в :root (если доступны)
      if (tp) {
        var keys = ['bg_color','text_color','hint_color','link_color','button_color',
                    'button_text_color','secondary_bg_color','header_bg_color',
                    'accent_text_color','section_bg_color','section_header_text_color',
                    'subtitle_text_color','destructive_text_color'];
        for (var i = 0; i < keys.length; i++) {
          var val = tp[keys[i]];
          if (val) {
            var cssVar = '--tg-' + keys[i].replace(/_/g, '-');
            document.documentElement.style.setProperty(cssVar, val);
          }
        }
      }
    } catch(e) { /* безопасный fail */ }
  })();
</script>

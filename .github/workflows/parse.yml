name: Parse Telegram & Update Events

on:
  schedule:
    # Каждый час
    - cron: '0 * * * *'
  workflow_dispatch:  # Ручной запуск

jobs:
  parse:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run parse script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python parse_telegram.py

      - name: Commit and push changes
        env:
          PAT: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name "meowafisha-bot"
          git config --global user.email "bot@meowafisha.app"
          
          # Проверяем, есть ли изменения
          if git diff --quiet && git diff --staged --quiet; then
            # Проверяем untracked files
            if [ -z "$(git status --porcelain)" ]; then
              echo "No changes to commit"
              exit 0
            fi
          fi
          
          git add events.json geocode_cache.json
          git add -f geocode_cache.json
          
          # Если есть что коммитить
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update events from Telegram [$(date +'%d.%m.%Y %H:%M')]"
            git remote set-url origin https://x-access-token:${PAT}@github.com/${{ github.repository }}.git
            git push origin HEAD:${GITHUB_REF##*/}
          else
            echo "No changes to commit"
          fi
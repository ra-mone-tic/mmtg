name: Parse Telegram channel

on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true 

jobs:
  parse:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parser
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python parse_telegram.py

      # ── Генерация events.json из Supabase ────────────
      - name: Generate events.json from Supabase
        id: generate-json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
import json, os, urllib.request

base_url = os.environ['SUPABASE_URL'].rstrip('/')
api_key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
headers = {
    'apikey': api_key,
    'Authorization': 'Bearer ' + api_key,
    'Accept': 'application/json',
}

# Постраничная выгрузка с лимитом 1000 записей на страницу
all_events = []
offset = 0
limit = 1000

while True:
    url = f'{base_url}/rest/v1/events?select=*&order=date.asc&limit={limit}&offset={offset}'
    req = urllib.request.Request(url, headers=headers)
    with urllib.request.urlopen(req, timeout=30) as resp:
        page = json.loads(resp.read().decode('utf-8'))
    if not page:
        break
    all_events.extend(page)
    offset += limit
    if len(page) < limit:
        break

# Маппим обратно в формат events.json
output = []
for e in all_events:
    output.append({
        'id': e.get('id', ''),
        'date': e.get('date', ''),
        'title': e.get('title', ''),
        'location': e.get('location', ''),
        'address': e.get('address', ''),
        'time': e.get('time', ''),
        'tags': e.get('tags', []),
        'short_description': e.get('short_description', ''),
        'full_description': e.get('full_description', ''),
        'description_blocks': e.get('description_blocks', []),
        'contacts': e.get('contacts', ''),
        'lat': e.get('lat'),
        'lon': e.get('lon'),
        'imageUrl': e.get('image_url', ''),
        'image_url': e.get('image_url', ''),
        'tg_message_id': e.get('tg_message_id'),
        'is_active': e.get('is_active', True),
    })

with open('events.json', 'w', encoding='utf-8') as f:
    json.dump(output, f, ensure_ascii=False, indent=2)

print(f'Сгенерирован events.json: {len(output)} событий')
"

      - name: Commit events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"

          git add events.json

          git diff --cached --quiet || git commit -m "Update events.json [skip ci]"
          git pull --rebase && git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
name: Mini JS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  minify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create dist directories
        run: mkdir -p dist/js dist/css dist/fonts dist/images

      - name: Minify JS
        run: npx esbuild assets/js/*.js --minify --outdir=dist/js

      - name: Copy assets & static files
        run: |
          cp index.html dist/
          cp -r assets dist/

      - name: Rewrite JS paths in HTML
        run: |
          python -c "import pathlib; p=pathlib.Path('dist/index.html'); t=p.read_text(encoding='utf-8'); t=t.replace(\"'./assets/js/\", \"'./dist/js/\"); p.write_text(t, encoding='utf-8')"

      - name: Cache-bust assets
        # Telegram Desktop агрессивно кэширует мини-аппы по точному URL и не всегда
        # сбрасывает кэш сам (известный баг tdesktop). Поэтому версионируем КАЖДЫЙ
        # относительный JS-импорт (включая вложенные модули, не только entry-point)
        # и CSS-ссылки query-параметром ?v=<sha коммита> — для Desktop это будет
        # выглядеть как новый URL, который точно не лежит в кэше.
        run: |
          VERSION=${GITHUB_SHA::8}
          echo "Build version: $VERSION"

          # entry-импорт и CSS в index.html
          sed -i "s#\./dist/js/meow-core\.js#./dist/js/meow-core.js?v=${VERSION}#" dist/index.html
          sed -i "s#assets/css/social\.css#assets/css/social.css?v=${VERSION}#" dist/index.html
          sed -i "s#assets/css/admin\.css#assets/css/admin.css?v=${VERSION}#" dist/index.html

          # все вложенные относительные импорты внутри минифицированных модулей
          find dist/js -name '*.js' -print0 \
            | xargs -0 sed -i -E "s#from(['\"])\./([A-Za-z0-9_-]+\.js)\1#from\1./\2?v=${VERSION}\1#g"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>MEOW!</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════
   DESIGN TOKENS
══════════════════════════════════════════════════ */
:root {
  /* ─ Light ─────────────────────────────────── */
  --c-canvas:   #e7e5f1;
  --c-glass:    rgba(249, 247, 255, 0.70);
  --c-glass-br: rgba(255, 255, 255, 0.58);
  --c-card:     rgba(255, 255, 255, 0.93);
  --c-card-br:  #191432;
  --c-pill:     rgba(18, 14, 44, 0.88);
  --c-pill-fg:  #ede8ff;
  --c-soft-br:  rgba(24, 20, 50, 0.09);
  --c-t1:       #15112e;
  --c-t2:       #726d88;
  --c-accent:   #6652bb;
  --c-accent-d: rgba(102, 82, 187, 0.10);
  --c-accent-g: rgba(102, 82, 187, 0.22);
  --c-pin:      #ccc3ec;
  --c-pin-a:    #6652bb;
  --c-pin-e:    #15112e;
  --c-sol-bg:   #15112e;
  --c-sol-fg:   #ffffff;
  --c-out-br:   #15112e;
  --c-out-fg:   #15112e;

  --sh-card:  0 8px 32px rgba(102,82,187,.13), 0 2px 6px rgba(0,0,0,.06);
  --sh-float: 0 2px 12px rgba(0,0,0,.09), 0 1px 3px rgba(0,0,0,.04);
  --sh-glow:  0 4px 22px rgba(102,82,187,.26);

  --blur: blur(20px) saturate(1.6);
  --r-p: 999px; --r-c: 20px; --r-b: 50px;
  --ph: 14px; --bar-h: 62px;
  --sai-t: env(safe-area-inset-top,0px);
  --sai-b: env(safe-area-inset-bottom,0px);
  --ease-s: cubic-bezier(.34,1.56,.64,1);
  --ease-o: cubic-bezier(.16,1,.3,1);
  --ff: 'Manrope', system-ui, sans-serif;
}

[data-theme="dark"] {
  --c-canvas:   #0b0b1a;
  --c-glass:    rgba(17,14,42,.78);
  --c-glass-br: rgba(118,98,218,.17);
  --c-card:     rgba(15,12,40,.92);
  --c-card-br:  rgba(118,98,218,.28);
  --c-pill:     rgba(22,18,54,.92);
  --c-pill-fg:  #dbd4ff;
  --c-soft-br:  rgba(118,98,218,.11);
  --c-t1:       #ece6ff;
  --c-t2:       #938eb4;
  --c-accent:   #9880de;
  --c-accent-d: rgba(152,128,222,.14);
  --c-accent-g: rgba(152,128,222,.26);
  --c-pin:      #6652bb;
  --c-pin-a:    #b3a6ee;
  --c-pin-e:    #ece6ff;
  --c-sol-bg:   #6e5ec8;
  --c-sol-fg:   #ffffff;
  --c-out-br:   rgba(152,128,222,.48);
  --c-out-fg:   #dbd4ff;

  --sh-card:  0 8px 40px rgba(0,0,0,.54), 0 2px 8px rgba(0,0,0,.24);
  --sh-float: 0 2px 16px rgba(0,0,0,.30);
  --sh-glow:  0 4px 24px rgba(152,128,222,.28);
}

/* ══════════════════════════════════════════════════
   BASE
══════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--ff);background:var(--c-canvas);color:var(--c-t1);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{cursor:pointer;font-family:inherit;border:none;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font-family:inherit;border:none;outline:none;background:none;-webkit-tap-highlight-color:transparent}
svg{display:block;flex-shrink:0}

/* ── Shell ──────────────────────────────────────── */
#app{position:relative;width:100%;height:100dvh;max-width:428px;margin:0 auto;overflow:hidden}

/* ── Map ────────────────────────────────────────── */
#map{position:absolute;inset:0;z-index:0}
.maplibregl-ctrl-logo,.maplibregl-ctrl-attrib,
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none!important}

/* ── Loading ────────────────────────────────────── */
#loading{
  position:absolute;inset:0;z-index:50;
  background:var(--c-canvas);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .4s ease,visibility .4s ease;
}
#loading.gone{opacity:0;visibility:hidden;pointer-events:none}
.spinner{width:32px;height:32px;border:3px solid var(--c-soft-br);border-top-color:var(--c-accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;font-weight:600;color:var(--c-t2)}

/* ══════════════════════════════════════════════════
   TOP BAR — logo | theme-btn | avatar
══════════════════════════════════════════════════ */
.top-bar{
  position:absolute;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--sai-t) + 10px) var(--ph) 8px;
  background:linear-gradient(180deg,var(--c-canvas) 52%,transparent);
  pointer-events:none;
}
.top-bar>*{pointer-events:auto}

/* Logo */
.logo{font-weight:900;font-size:18px;letter-spacing:-.4px;color:var(--c-t1);user-select:none;line-height:1;display:flex;align-items:center;gap:0}
.logo-o{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;position:relative;transition:transform .25s var(--ease-s)}
.logo:hover .logo-o{transform:scale(1.22) rotate(-14deg)}

/* Top-right actions */
.tb-right{display:flex;align-items:center;gap:8px}

/* Glass icon button (theme) */
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--c-glass);border:1px solid var(--c-glass-br);
  color:var(--c-t1);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-float);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  transition:transform .14s var(--ease-s),box-shadow .14s;
}
.icon-btn:active{transform:scale(.88)}

/* Avatar */
.avatar-btn{
  width:38px;height:38px;border-radius:50%;overflow:hidden;
  background:var(--c-accent);border:2px solid rgba(255,255,255,.28);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;letter-spacing:-.2px;
  box-shadow:var(--sh-glow),var(--sh-float);
  background-size:cover;background-position:center;
  transition:transform .14s var(--ease-s);
  flex-shrink:0;-webkit-tap-highlight-color:transparent;
}
.avatar-btn:active{transform:scale(.88)}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}

/* ══════════════════════════════════════════════════
   FILTER ROW — date-pill | события
══════════════════════════════════════════════════ */
.filter-row{
  position:absolute;z-index:20;
  top:calc(var(--sai-t) + 62px);
  left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--ph);
  pointer-events:none;
}
.filter-row>*{pointer-events:auto}

/* Shared pill */
.pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:var(--r-p);
  font-size:13px;font-weight:700;letter-spacing:.01em;
  white-space:nowrap;cursor:pointer;
  box-shadow:var(--sh-float);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  transition:transform .14s var(--ease-s),box-shadow .14s;
}
.pill:active{transform:scale(.95)}
/* Dark pill (date) */
.pill-dark{background:var(--c-pill);color:var(--c-pill-fg);border:1px solid transparent}
.pill-dark:hover{box-shadow:var(--sh-glow)}
/* Glass pill (events) */
.pill-glass{background:var(--c-glass);color:var(--c-t1);border:1px solid var(--c-glass-br)}
.pill-glass.active{background:var(--c-accent);color:#fff;border-color:transparent;box-shadow:var(--sh-glow)}

/* ══════════════════════════════════════════════════
   EVENTS PANEL
══════════════════════════════════════════════════ */
.events-panel{
  position:absolute;z-index:25;
  top:calc(var(--sai-t) + 112px);
  right:var(--ph);
  width:min(244px,calc(100% - 28px));
  max-height:calc(100dvh - 230px);
  background:var(--c-glass);border:1px solid var(--c-glass-br);
  border-radius:var(--r-c);
  box-shadow:var(--sh-card);
  overflow:hidden;display:flex;flex-direction:column;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  opacity:0;transform:translateY(-10px) scale(.97);
  transform-origin:top right;pointer-events:none;
  transition:opacity .22s var(--ease-o),transform .22s var(--ease-o);
}
.events-panel.open{opacity:1;transform:none;pointer-events:auto}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 10px;border-bottom:1px solid var(--c-soft-br);flex-shrink:0}
.panel-title{font-size:15px;font-weight:800}
.panel-close{width:26px;height:26px;border-radius:50%;background:var(--c-accent-d);color:var(--c-t2);display:flex;align-items:center;justify-content:center;transition:all .13s}
.panel-close:hover{color:var(--c-accent)}
.events-list{overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:var(--c-accent-d) transparent}
.events-list::-webkit-scrollbar{width:3px}
.events-list::-webkit-scrollbar-thumb{background:var(--c-accent-d);border-radius:2px}
.day-label{padding:5px 8px 3px;font-size:9.5px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;color:var(--c-t2)}
.event-item{padding:9px 10px 9px 12px;border-radius:12px;border-left:3px solid transparent;cursor:pointer;transition:background .12s,border-color .12s}
.event-item:hover{background:var(--c-accent-d)}
.event-item.active{background:var(--c-accent-d);border-left-color:var(--c-accent)}
.event-item-title{font-size:12.5px;font-weight:700;line-height:1.3}
.event-item-sub{font-size:11px;color:var(--c-t2);margin-top:2px}

/* ══════════════════════════════════════════════════
   EVENT CARD — compact bottom sheet
══════════════════════════════════════════════════ */
.event-card{
  position:absolute;z-index:20;
  left:var(--ph);right:var(--ph);
  bottom:calc(var(--sai-b) + var(--bar-h) + 12px);
  background:var(--c-card);border:2.5px solid var(--c-card-br);
  border-radius:var(--r-c);
  padding:15px 16px 17px;
  box-shadow:var(--sh-card);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  opacity:0;transform:translateY(22px);pointer-events:none;
  transition:opacity .28s var(--ease-o),transform .28s var(--ease-o);
}
.event-card.open{opacity:1;transform:translateY(0);pointer-events:auto}

.venue-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-p);background:var(--c-accent-d);font-size:11px;font-weight:700;color:var(--c-accent);margin-bottom:10px;max-width:calc(100% - 36px)}
.venue-tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card-close{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--c-soft-br);background:var(--c-accent-d);color:var(--c-t2);display:flex;align-items:center;justify-content:center;transition:all .13s}
.card-close:hover{border-color:var(--c-accent);color:var(--c-accent)}

.card-title{font-size:20px;font-weight:900;line-height:1.18;color:var(--c-t1);margin-bottom:10px;padding-right:30px;letter-spacing:-.3px}
.card-meta{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.meta-row{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--c-t2);line-height:1}
.meta-row svg{color:var(--c-accent)}
.card-desc{font-size:12.5px;line-height:1.62;color:var(--c-t2);margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-actions{display:flex;gap:8px}
.btn-a,.btn-b{flex:1;height:43px;border-radius:var(--r-b);font-size:13px;font-weight:700;transition:transform .13s var(--ease-s),box-shadow .13s}
.btn-a{background:var(--c-sol-bg);color:var(--c-sol-fg)}
.btn-b{background:transparent;color:var(--c-out-fg);border:2px solid var(--c-out-br)}
.btn-a:hover{box-shadow:var(--sh-glow)}
.btn-a:active,.btn-b:active{transform:scale(.97)}

/* ══════════════════════════════════════════════════
   DETAIL MODAL — full screen slide-up
══════════════════════════════════════════════════ */
.event-detail{
  position:absolute;z-index:40;inset:0;
  display:flex;flex-direction:column;
  background:var(--c-canvas);
  opacity:0;transform:translateY(100%);pointer-events:none;
  transition:opacity .36s var(--ease-o),transform .36s var(--ease-o);
}
.event-detail.open{opacity:1;transform:translateY(0);pointer-events:auto}

/* Poster */
.detail-poster{position:relative;width:100%;height:238px;flex-shrink:0;overflow:hidden}
.detail-poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.poster-initial{font-size:96px;font-weight:900;color:rgba(255,255,255,.18);line-height:1;user-select:none}
.poster-fade{position:absolute;bottom:0;left:0;right:0;height:88px;background:linear-gradient(transparent,var(--c-canvas))}
.poster-badge{
  position:absolute;top:calc(var(--sai-t) + 12px);right:14px;z-index:2;
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:30px;
  background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.14);
  font-size:12px;font-weight:700;color:#fff;
  backdrop-filter:blur(8px);
}

/* Back button */
.detail-back{
  position:absolute;top:calc(var(--sai-t) + 12px);left:14px;z-index:2;
  width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.18);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
  transition:transform .14s var(--ease-s),background .14s;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.detail-back:active{transform:scale(.88)}

/* Scrollable body */
.detail-body{
  flex:1;overflow-y:auto;
  padding:18px var(--ph) calc(var(--sai-b) + 96px);
  scrollbar-width:thin;scrollbar-color:var(--c-accent-d) transparent;
}
.detail-body::-webkit-scrollbar{width:3px}
.detail-body::-webkit-scrollbar-thumb{background:var(--c-accent-d);border-radius:2px}

.detail-venue-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-p);background:var(--c-accent-d);font-size:11px;font-weight:700;color:var(--c-accent);margin-bottom:12px}
.detail-title{font-size:24px;font-weight:900;line-height:1.14;letter-spacing:-.4px;color:var(--c-t1);margin-bottom:14px}
.detail-meta{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.detail-meta .meta-row{font-size:13.5px}
.detail-desc{font-size:14px;line-height:1.72;color:var(--c-t2)}

/* Fixed action bar */
.detail-actions{
  position:absolute;bottom:0;left:0;right:0;
  padding:16px var(--ph) calc(var(--sai-b) + 16px);
  background:linear-gradient(0deg,var(--c-canvas) 62%,transparent);
  display:flex;gap:8px;
}
.btn-contacts{
  flex:1;height:44px;border-radius:var(--r-b);
  background:var(--c-glass);border:1px solid var(--c-glass-br);
  color:var(--c-t1);font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px;
  backdrop-filter:var(--blur);
  transition:transform .13s var(--ease-s),box-shadow .13s;
}
.btn-contacts:active{transform:scale(.97)}
.btn-detail-share{
  flex:1;height:44px;border-radius:var(--r-b);
  background:var(--c-sol-bg);color:var(--c-sol-fg);
  font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .13s var(--ease-s),box-shadow .13s;
}
.btn-detail-share:hover{box-shadow:var(--sh-glow)}
.btn-detail-share:active{transform:scale(.97)}

/* ══════════════════════════════════════════════════
   BOTTOM BAR — search
══════════════════════════════════════════════════ */
.bottom-bar{
  position:absolute;z-index:20;left:0;right:0;bottom:0;
  padding:8px var(--ph) calc(var(--sai-b) + 8px);
  background:linear-gradient(0deg,var(--c-canvas) 52%,transparent);
  pointer-events:none;
}
.bottom-bar>*{pointer-events:auto}
.search-wrap{position:relative;display:flex;align-items:center}
.search-icon{position:absolute;left:15px;color:var(--c-t2);pointer-events:none;z-index:1;transition:color .15s}
.search-input{
  width:100%;height:46px;
  padding:0 16px 0 44px;
  background:var(--c-glass);border:1px solid var(--c-glass-br);
  border-radius:var(--r-p);
  font-size:14px;font-weight:500;color:var(--c-t1);
  box-shadow:var(--sh-card);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  transition:border-color .18s,box-shadow .18s;
}
.search-input::placeholder{color:var(--c-t2)}
.search-input:focus{border-color:var(--c-accent);box-shadow:0 0 0 3px var(--c-accent-g),var(--sh-float)}
.search-wrap:focus-within .search-icon{color:var(--c-accent)}

/* ══════════════════════════════════════════════════
   MAP CONTROLS  (+  −  ⊕)
══════════════════════════════════════════════════ */
.map-controls{
  position:absolute;z-index:20;right:var(--ph);
  display:flex;flex-direction:column;gap:8px;
  transition:bottom .28s var(--ease-o);
  /* default position set by JS */
}
.map-ctrl{
  width:44px;height:44px;border-radius:50%;
  background:var(--c-glass);border:1px solid var(--c-glass-br);
  color:var(--c-t1);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-float);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  transition:transform .14s var(--ease-s),box-shadow .14s;
}
.map-ctrl:active{transform:scale(.88)}
.map-ctrl:hover{box-shadow:var(--sh-glow)}

/* ── Custom pin marker ──────────────────────────── */
.m-pin{
  width:34px;height:42px;cursor:pointer;
  transform-origin:bottom center;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.20));
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform .22s var(--ease-s),filter .15s;
}
.m-pin:hover{transform:scale(1.14)}
.m-pin.active{transform:scale(1.28);filter:drop-shadow(0 5px 12px var(--c-accent-g))}

/* ── Toast ──────────────────────────────────────── */
.toast{
  position:absolute;z-index:80;
  left:50%;transform:translateX(-50%) translateY(14px);
  padding:10px 20px;
  background:var(--c-pill);color:var(--c-pill-fg);
  border-radius:30px;font-size:13px;font-weight:600;
  box-shadow:var(--sh-card);white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s var(--ease-o);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

<!-- MAP -->
<div id="map"></div>

<!-- LOADING -->
<div id="loading" aria-live="polite">
  <div class="spinner"></div>
  <span class="loading-text">Загружаем карту…</span>
</div>

<!-- ═══════════════════ TOP BAR ═════════════════════ -->
<header class="top-bar">
  <span class="logo" aria-label="MEOW!">
    ME<span class="logo-o" aria-hidden="true">
      <svg width="19" height="20" viewBox="0 0 20 21" xmlns="http://www.w3.org/2000/svg">
        <!-- circle -->
        <circle cx="10" cy="13" r="7.2" fill="var(--c-accent)" stroke="var(--c-t1)" stroke-width="1.55"/>
        <!-- ears -->
        <path d="M3.5 9.5 L7 3.5 L10.5 9.5" fill="var(--c-accent)" stroke="var(--c-t1)" stroke-width="1.35" stroke-linejoin="round"/>
        <path d="M9.5 9.5 L13 3.5 L16.5 9.5" fill="var(--c-accent)" stroke="var(--c-t1)" stroke-width="1.35" stroke-linejoin="round"/>
        <!-- eyes -->
        <ellipse cx="7.5" cy="13" rx="1" ry="1.2" fill="var(--c-t1)"/>
        <ellipse cx="12.5" cy="13" rx="1" ry="1.2" fill="var(--c-t1)"/>
        <!-- nose -->

<script>
/* ═══════════════════════════════════════════════════════════
   MEOW!  v2 — Event Discovery Map
   Vanilla JS · MapLibre GL · Telegram Mini App ready

   ─ INTEGRATION HOOKS ────────────────────────────────────
   loadEvents(dateStr)      → Promise<Event[]>
   onEventContacts(event)   → void
   onSearch(query)          → void
   onDateChange(dateStr)    → void
   onAvatarTap()            → void

   ─ EVENT SHAPE ──────────────────────────────────────────
   { id, title, venue, address, date, time, desc, imageUrl?, lng, lat }
═══════════════════════════════════════════════════════════ */

/* ─── Config ──────────────────────────────────────────── */
const CFG = {
  MAP_CENTER:  [37.617, 55.755],   // [lng, lat] — change to your city
  MAP_ZOOM:    12.5,
  FLY_ZOOM:    14.5,
  FLY_OFFSET:  [0, 70],
  FLY_MS:      540,
  SHARE_BASE:  'https://t.me/your_bot?start=',  // TODO: replace
  STYLES: {
    light: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
    dark:  'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  },
  POSTER_GRADS: [
    ['#6652bb','#a87ef0'],['#b84f70','#ee80aa'],
    ['#5070bc','#7ca8f2'],['#4898b8','#74ccee'],
    ['#6ab048','#96e270'],['#b87a40','#eaaa60'],
  ],
};

/* ─── Telegram WebApp ─────────────────────────────────── */
const TG = window.Telegram?.WebApp ?? null;

/* ─── Demo data ───────────────────────────────────────── */
const DEMO = [
  { id:'e-001', title:'Выходные в Баре Советов', venue:'Бар Советов',
    address:'пр-т. Мира 118', date:'28.05.2026', time:'21:00 – 02:00',
    desc:'Живая музыка, авторские коктейли и уютная атмосфера советского ретро. Каждую пятницу и субботу — специальная программа с приглашёнными артистами. Дресс-код: smart casual. Вход свободный до 22:00.',
    imageUrl:null, lng:37.631, lat:55.762 },
  { id:'e-002', title:'Джазовый вечер', venue:'Клуб Импровизации',
    address:'ул. Тверская 22', date:'28.05.2026', time:'19:00 – 23:00',
    desc:'Лучшие джазовые музыканты города в камерном клубном формате. Билет включает два фирменных напитка. Приходите до 18:30 — аперитив за счёт заведения.',
    imageUrl:null, lng:37.608, lat:55.763 },
  { id:'e-003', title:'Арт-маркет на набережной', venue:'Пречистенская набережная',
    address:'Пречистенская наб. 1', date:'28.05.2026', time:'11:00 – 20:00',
    desc:'Ярмарка независимых художников, дизайнеров и мастеров hand-made. Более 50 участников, мастер-классы по батику и лепке, уличная еда и живая музыка.',
    imageUrl:null, lng:37.592, lat:55.740 },
  { id:'e-004', title:'Йога на рассвете', venue:'Парк Горького',
    address:'ул. Крымский Вал 9', date:'28.05.2026', time:'06:30 – 08:00',
    desc:'Открытая практика хатха-йоги на свежем воздухе. Подходит для любого уровня подготовки. Коврик не нужен — берите только себя и хорошее настроение.',
    imageUrl:null, lng:37.601, lat:55.729 },
];

/* ─── Integration hooks ───────────────────────────────── */
async function loadEvents(dateStr) {
  // TODO: return await fetch(`/api/events?date=${dateStr}`).then(r => r.json());
  return DEMO.filter(e => e.date === dateStr);
}
function onEventContacts(ev) {
  // TODO: open contacts sheet
  TG?.HapticFeedback?.impactOccurred('light');
  console.log('[MEOW] contacts:', ev.id);
}
function onSearch(q) { console.log('[MEOW] search:', q); }
function onDateChange(d) { console.log('[MEOW] date:', d); }
function onAvatarTap() { console.log('[MEOW] profile'); }

/* ─── State ───────────────────────────────────────────── */
let map       = null, markers = [], events = [];
let activeId  = null, detailId = null;
let panelOpen = false, theme = 'light';
let currentDate = new Date(2026, 4, 28);  // May 28 2026

/* ─── Helpers ─────────────────────────────────────────── */
const $  = id => document.getElementById(id);
const qs = s  => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const fmt = d => `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
const dayNames = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];

function dayName(str) {
  const [d,m,y] = str.split('.').map(Number);
  return dayNames[new Date(y,m-1,d).getDay()];
}

function posterGrad(id) {
  const g = CFG.POSTER_GRADS;
  const [a,b] = g[id.charCodeAt(id.length-1) % g.length];
  return `linear-gradient(135deg,${a},${b})`;
}

const PIN_ICONS = `
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
</svg>`;
const CAL_ICON = `
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="4" width="18" height="18" rx="2"/>
  <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
</svg>`;
const CLK_ICON = `
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
</svg>`;

function metaHTML(ev) {
  return `<div class="meta-row">${PIN_ICONS}${ev.address}</div>
          <div class="meta-row">${CAL_ICON}${ev.date}</div>
          <div class="meta-row">${CLK_ICON}${ev.time}</div>`;
}

/* ─── Toast ───────────────────────────────────────────── */
let toastT;
function showToast(msg, pos) {
  let el = qs('.toast');
  if (!el) { el = document.createElement('div'); el.className='toast'; $('app').appendChild(el); }
  el.textContent = msg;
  el.style.bottom = (pos ?? (($('bottom-bar')?.offsetHeight ?? 62) + 20)) + 'px';
  clearTimeout(toastT);
  el.classList.remove('show');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.classList.add('show');
    toastT = setTimeout(() => el.classList.remove('show'), 2600);
  }));
}

/* ─── Share ───────────────────────────────────────────── */
function shareEvent(ev) {
  const link = CFG.SHARE_BASE + ev.id;
  const ok = () => {
    TG?.HapticFeedback?.notificationOccurred('success');
    if (TG?.showPopup) {
      TG.showPopup({
        title:   'Ссылка скопирована',
        message: `«${ev.title}» готова к отправке`,
        buttons: [{ type:'ok', text:'Отлично!' }]
      });
    } else {
      showToast('🔗 Ссылка скопирована!');
    }
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(link).then(ok).catch(() => legacyCopy(link, ok));
  } else {
    legacyCopy(link, ok);
  }
}

function legacyCopy(text, cb) {
  const ta = Object.assign(document.createElement('textarea'), {
    value: text, readOnly: true,
    style: 'position:fixed;left:-9999px;opacity:0'
  });
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e) {}
  ta.remove();
}

/* ─── Theme ───────────────────────────────────────────── */
function initTheme() {
  const saved = localStorage.getItem('meow-theme');
  const sys   = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  applyTheme(saved || sys, false);
}

function applyTheme(t, updateMap=true) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('meow-theme', t);
  const ico = $('theme-icon');
  if (t === 'dark') {
    ico.innerHTML = `<circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
  } else {
    ico.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
  }
  if (updateMap && map) {
    map.once('style.load', renderMarkers);
    map.setStyle(CFG.STYLES[t]);
  }
}

/* ─── Avatar ──────────────────────────────────────────── */
function initAvatar() {
  const btn  = $('btn-avatar');
  const user = TG?.initDataUnsafe?.user ?? null;
  if (!user) return; // keep default person icon
  if (user.photo_url) {
    const img = new Image();
    img.onload = () => {
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
      btn.innerHTML = ''; btn.appendChild(img);
    };
    img.onerror = () => setInitials(btn, user);
    img.src = user.photo_url;
  } else {
    setInitials(btn, user);
  }
}

function setInitials(btn, user) {
  btn.textContent = (user.first_name[0] + (user.last_name?.[0] ?? '')).toUpperCase();
}

/* ─── Map ─────────────────────────────────────────────── */
function initMap() {
  map = new maplibregl.Map({
    container: 'map', style: CFG.STYLES[theme],
    center: CFG.MAP_CENTER, zoom: CFG.MAP_ZOOM,
    attributionControl: false,
  });
  map.on('load', () => { $('loading').classList.add('gone'); renderMarkers(); });
  map.on('style.load', renderMarkers);
  map.on('click', closeCard);
}

/* ─── Pins ────────────────────────────────────────────── */
function pinSVG(active) {
  const body = active ? 'var(--c-pin-a)' : 'var(--c-pin)';
  return `<svg width="34" height="42" viewBox="0 0 34 42" xmlns="http://www.w3.org/2000/svg">
    <path d="M17 2C10.37 2 5 7.37 5 14c0 9.63 12 26 12 26S29 23.63 29 14 23.63 2 17 2z"
      fill="${body}" stroke="var(--c-pin-e)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="17" cy="14" r="4.5" fill="var(--c-pin-e)" opacity="${active?.38:.20}"/>
  </svg>`;
}

function makeMarker(ev) {
  const el = document.createElement('div');
  el.className = 'm-pin';
  el.setAttribute('data-id', ev.id);
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', ev.title);
  el.setAttribute('tabindex', '0');
  el.innerHTML = pinSVG(false);
  el.addEventListener('click', e => { e.stopPropagation(); openCard(ev.id); flyTo(ev); });
  el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); openCard(ev.id); flyTo(ev); }});
  return { id:ev.id, ml: new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([ev.lng,ev.lat]).addTo(map) };
}

function renderMarkers() {
  markers.forEach(m=>m.ml.remove());
  markers = events.map(ev=>makeMarker(ev));
  if (activeId) setPin(activeId, true);
}

function setPin(id, active) {
  const el = document.querySelector(`.m-pin[data-id="${id}"]`);
  if (!el) return;
  el.innerHTML = pinSVG(active);
  el.classList.toggle('active', active);
}

function flyTo(ev) {
  map.flyTo({center:[ev.lng,ev.lat],zoom:CFG.FLY_ZOOM,offset:CFG.FLY_OFFSET,duration:CFG.FLY_MS,essential:true});
}

/* ─── Card ────────────────────────────────────────────── */
function openCard(id) {
  const ev = events.find(e=>e.id===id);
  if (!ev) return;
  if (activeId && activeId!==id) setPin(activeId, false);
  activeId = id; setPin(id, true);
  $('card-venue').textContent = ev.venue;
  $('card-title').textContent = ev.title;
  $('card-desc').textContent  = ev.desc;
  $('card-meta').innerHTML    = metaHTML(ev);
  $('btn-learn-more').onclick = () => openDetail(id);
  $('btn-share').onclick      = () => shareEvent(ev);
  const card = $('event-card');
  card.classList.add('open'); card.setAttribute('aria-hidden','false');
  shiftControls(true); syncActive(id);
}

function closeCard() {
  if (!activeId) return;
  setPin(activeId, false); activeId = null;
  $('event-card').classList.remove('open');
  $('event-card').setAttribute('aria-hidden','true');
  shiftControls(false); syncActive(null);
}

/* ─── Controls shift ──────────────────────────────────── */
function ctrlBase() {
  return ($('bottom-bar')?.offsetHeight ?? 62) + 12;
}
function shiftControls(cardOpen) {
  const ctrl = $('map-controls');
  if (cardOpen) {
    ctrl.style.bottom = (ctrlBase() + $('event-card').offsetHeight + 12) + 'px';
  } else {
    ctrl.style.bottom = ctrlBase() + 'px';
  }
}
new ResizeObserver(()=>{ if (activeId) shiftControls(true); }).observe($('event-card'));

/* ─── Detail ──────────────────────────────────────────── */
function openDetail(id) {
  const ev = events.find(e=>e.id===id);
  if (!ev) return;
  detailId = id;
  // Poster
  const poster = $('detail-poster');
  poster.style.background = posterGrad(ev.id);
  if (ev.imageUrl) {
    $('poster-inner').innerHTML = `<img src="${ev.imageUrl}" alt="${ev.title}">`;
  } else {
    $('poster-inner').innerHTML = `<span class="poster-initial">${ev.title[0]}</span>`;
  }
  $('poster-date').textContent   = ev.date;
  $('detail-venue').textContent  = ev.venue;
  $('detail-title').textContent  = ev.title;
  $('detail-meta').innerHTML     = metaHTML(ev).replace(/13px/g,'13.5px');
  $('detail-desc').textContent   = ev.desc;
  $('btn-contacts').onclick      = () => onEventContacts(ev);
  $('btn-detail-share').onclick  = () => shareEvent(ev);
  const modal = $('event-detail');
  modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
  $('detail-body').scrollTop = 0;
  TG?.HapticFeedback?.selectionChanged();
  // Support hardware back
  history.pushState({meowDetail:true},'');
}

function closeDetail() {
  $('event-detail').classList.remove('open');
  $('event-detail').setAttribute('aria-hidden','true');
  detailId = null;
  TG?.HapticFeedback?.impactOccurred('light');
}

// Swipe-down gesture on detail
let swipeY = 0;
$('event-detail').addEventListener('touchstart', e=>{swipeY=e.touches[0].clientY;},{passive:true});
$('event-detail').addEventListener('touchend', e=>{
  if ($('detail-body').scrollTop===0 && e.changedTouches[0].clientY-swipeY>72) closeDetail();
},{passive:true});

// Hardware back button
window.addEventListener('popstate', ()=>{
  if ($('event-detail').classList.contains('open')) closeDetail();
});

/* ─── Events list ─────────────────────────────────────── */
function renderList() {
  const list = $('events-list'); list.innerHTML='';
  if (!events.length) {
    list.innerHTML='<p style="padding:16px;text-align:center;font-size:13px;color:var(--c-t2)">Событий нет</p>';
    return;
  }
  const groups = events.reduce((a,e)=>{ (a[e.date]??=[]).push(e); return a; },{});
  for (const [date,evs] of Object.entries(groups)) {
    const lbl = Object.assign(document.createElement('div'),{className:'day-label',textContent:dayName(date).toUpperCase()});
    list.appendChild(lbl);
    evs.forEach(ev=>{
      const item = document.createElement('div');
      item.className='event-item'+(ev.id===activeId?' active':'');
      item.setAttribute('role','listitem'); item.setAttribute('data-id',ev.id); item.setAttribute('tabindex','0');
      item.innerHTML=`<div class="event-item-title">${ev.title}</div><div class="event-item-sub">${ev.venue} · ${ev.time}</div>`;
      const go=()=>{flyTo(ev);openCard(ev.id);setPanel(false);};
      item.addEventListener('click',go);
      item.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
      list.appendChild(item);
    });
  }
}

function syncActive(id) {
  document.querySelectorAll('.event-item').forEach(el=>el.classList.toggle('active',el.getAttribute('data-id')===id));
}

function setPanel(open) {
  panelOpen = open;
  $('events-panel').classList.toggle('open', open);
  $('events-panel').setAttribute('aria-hidden', String(!open));
  $('btn-events').classList.toggle('active', open);
  $('btn-events').setAttribute('aria-expanded', String(open));
}

/* ─── Data ────────────────────────────────────────────── */
async function fetchEvents(dateStr) {
  try { events = await loadEvents(dateStr); } catch(e) { events=[]; console.error('[MEOW]',e); }
  if (map?.loaded()) renderMarkers();
  renderList();
}

/* ─── Listeners ───────────────────────────────────────── */
$('btn-theme').addEventListener('click', ()=>applyTheme(theme==='light'?'dark':'light'));
$('btn-avatar').addEventListener('click', onAvatarTap);
$('btn-events').addEventListener('click', ()=>setPanel(!panelOpen));
$('btn-close-panel').addEventListener('click', ()=>setPanel(false));
$('btn-close-card').addEventListener('click', closeCard);
$('btn-detail-back').addEventListener('click', ()=>{ if(history.state?.meowDetail) history.back(); else closeDetail(); });
$('btn-date').addEventListener('click', ()=>onDateChange(fmt(currentDate)));
$('btn-zoom-in').addEventListener('click', ()=>map?.zoomIn({duration:270}));
$('btn-zoom-out').addEventListener('click', ()=>map?.zoomOut({duration:270}));
$('btn-locate').addEventListener('click', ()=>{
  if (!navigator.geolocation) return;
  TG?.HapticFeedback?.impactOccurred('medium');
  navigator.geolocation.getCurrentPosition(
    ({coords})=>map?.flyTo({center:[coords.longitude,coords.latitude],zoom:14.5,duration:700}),
    err=>console.warn('[MEOW] geo:',err.message)
  );
});

let searchT;
$('search-input').addEventListener('input', e=>{
  clearTimeout(searchT);
  searchT=setTimeout(()=>onSearch(e.target.value.trim()),300);
});
$('search-input').addEventListener('focus', ()=>{ if(panelOpen) setPanel(false); });

$('map').addEventListener('touchstart', ()=>{ if(panelOpen) setPanel(false); },{passive:true});
['events-panel','event-card','event-detail'].forEach(id=>{
  $(id).addEventListener('click', e=>e.stopPropagation());
});

/* ─── Boot ────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', async ()=>{
  initTheme();
  initAvatar();
  $('date-label').textContent = fmt(currentDate);
  initMap();
  // Set controls initial position after layout
  requestAnimationFrame(()=>requestAnimationFrame(()=>shiftControls(false)));
  await fetchEvents(fmt(currentDate));
  TG?.ready();
  TG?.expand();
});
</script>
</body>
</html>
